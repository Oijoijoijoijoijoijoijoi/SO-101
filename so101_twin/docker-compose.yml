services:
  # 1. Hardware Tier: Serial-to-DDS
  microros-agent:
    build:
      context: .
      dockerfile: Dockerfile.microros-agent
    container_name: microros-agent
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=100
    volumes:
      - /dev:/dev
      - .:/scripts
    restart: unless-stopped
    # The command here matches your high-speed ESP32 telemetry
    command: serial --dev /dev/ttyUSB1 -b 921600 -v6

  # 2. Logic Tier: URDF, TF, and WebSocket Bridge
  ros2:
    build:
      context: .
      dockerfile: Dockerfile.ROS2
    container_name: ros2
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=100
    volumes:
      - .:/home/user/so101_ws
    restart: unless-stopped
    command: >
      bash -c "
      colcon build --symlink-install --packages-select so101_description &&
      source install/setup.bash &&
      ros2 launch so101_description viz.launch.py"

  # 3. Visualization Tier: Browser-based Desktop
  foxglove-viz:
    build:
      context: .
      dockerfile: Dockerfile.foxglove-viz
    container_name: foxglove-viz
    network_mode: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      # Disable DBus session bus entirely for Electron
      - DBUS_SESSION_BUS_ADDRESS=disabled
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri:rw
    # Privileged mode + host network usually negates the need for explicit group_add
    privileged: true
    shm_size: '2gb'
    restart: unless-stopped
